# Cloudflare Workers 部署配置
# 此文件为模板，部署时会由 generate-toml.js 自动生成最终配置
# 使用时无需修改此文件，直接运行 npm run deploy 即可

name = "cloudflare-imgbed"
main = "index.js"
compatibility_date = "2024-08-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 以下绑定会在部署时由 generate-toml.js 自动创建和配置
# [[kv_namespaces]]
# binding = "img_url"
# id = ""

# [[r2_buckets]]
# binding = "img_r2"
# bucket_name = ""